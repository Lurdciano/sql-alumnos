# Configuración de conexión a MySQL/MariaDB.
#
# Copiá este archivo como "config.properties" (junto al SQLAlumnos.exe)
# y cambiá los valores según tu equipo.
# Los valores de abajo son los que trae XAMPP por defecto.

# Servidor de la base de datos
db.host=localhost

# Puerto del servidor
db.puerto=3306

# Usuario (XAMPP usa root)
db.usuario=root

# Contraseña (en XAMPP suele estar vacía)
db.password=